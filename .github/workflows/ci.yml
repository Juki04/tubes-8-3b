# =======================================================
# CI.YML - GitHub Actions Workflow
# Tim C (DevOps) - Memastikan Kunci API dan Linting Kode
# =======================================================

name: CI/CD - Bundle Budget Planner

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize] # Trigger saat PR dibuka atau diperbarui

jobs:
  # =======================================================
  # JOB 1: BACKEND_LOGIC_TESTS (Tim A & C)
  # Fokus: Stabilitas PHP, Keamanan, dan Logika Inti (Krusial)
  # =======================================================
  backend_logic_tests:
    runs-on: ubuntu-latest
    
    # Menetapkan Environment Variables dari GitHub Secrets
    env:
      EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
      CURRENCY_API_KEY: ${{ secrets.CURRENCY_API_KEY }}

    steps:
    - name: ⬇️ Checkout kode
      uses: actions/checkout@v4

    - name: 🛠️ Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2' # DIREVISI: Menggunakan PHP 8.2 untuk dukungan modern
        extensions: curl, json # KRUSIAL: Menambahkan ekstensi JSON untuk fungsi json_decode
        cache: true 

    # Task Tim C: Memastikan Syntax PHP Benar
    - name: 🧹 PHP Syntax Check (Linting)
      run: |
        echo "Running PHP syntax check on API files..."
        find api/ -name "*.php" -exec php -l {} \;
        
    # --- KRUSIAL: Menjalankan PHP Built-in Server untuk Testing ---
    - name: 🚀 Start PHP Built-in Server
      run: |
        # Server PHP dijalankan di background untuk melayani endpoint API
        php -S 127.0.0.1:8000 -t . &
        SERVER_PID=$!
        sleep 5 # Beri waktu server untuk start
        echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV # Simpan PID untuk dihentikan nanti

    # Task Tim C: Test Validasi Input (Baru Ditambahkan)
    # Ini memastikan error handling berjalan sebelum logic utama diuji
    - name: 🧪 Test 0: Validasi Data Input (Tim C)
      run: |
        echo "Running input validation script..."
        # Asumsi api/test_validation.php adalah script CLI yang menguji berbagai skenario input.
        php api/test_validation.php
        
    # Task Tim A: Integration Test Logika Budgeting
    - name: 🧪 Test 1: Logika Budgeting (Diabaikan vs Dibeli)
      run: |
        echo "Testing low budget scenario for ISI_KAMAR_KOS bundle..."
        # Uji dengan budget sangat kecil ($10 USD)
        RESPONSE=$(curl -s "http://127.0.0.1:8000/api/bundle_creator.php?bundle_type=ISI_KAMAR_KOS&budget_usd=10")
        
        # Assertion: Memastikan adanya status 'Diabaikan' dalam response (Logika Anda berjalan)
        if echo "$RESPONSE" | grep -q "\"status_purchase\": \"Diabaikan\""; then
          echo "✅ ASSERTION SUCCESS: Logika Budgeting (Low Budget) berhasil. Item mahal diabaikan."
        else
          echo "❌ ASSERTION FAILED: Logika Budgeting Gagal. Response:"
          echo "$RESPONSE"
          exit 1
        fi

    # Task Tim A: Integration Test Skema dan Multi-API
    - name: 🧪 Test 2: Skema JSON dan Konversi IDR
      run: |
        echo "Testing API integration and JSON schema..."
        # Uji dengan budget standar ($500 USD)
        RESPONSE=$(curl -s "http://127.0.0.1:8000/api/bundle_creator.php?bundle_type=ISI_KAMAR_KOS&budget_usd=500")
        
        # Assertion: Memastikan kunci krusial ('currency_rate_idr') ada (Bukti API Currency berhasil dipanggil)
        if echo "$RESPONSE" | grep -q "\"currency_rate_idr\":"; then
          echo "✅ ASSERTION SUCCESS: Kunci Mata Uang (Multi-API) ditemukan."
        else
          echo "❌ ASSERTION FAILED: Kunci mata uang tidak ditemukan. Integrasi gagal. Response:"
          echo "$RESPONSE"
          exit 1
        fi
        
    # --- KRUSIAL: Menghentikan Server setelah Testing Selesai ---
    - name: 🛑 Stop PHP Server
      if: always() # Pastikan ini selalu berjalan, bahkan jika step sebelumnya gagal
      run: kill $SERVER_PID
      shell: bash


  # =======================================================
  # JOB 2: FRONTEND_VALIDATION (Tim B & D)
  # Fokus: Kualitas JS, Ketersediaan file HTML/CSS
  # =======================================================
  frontend_validation:
    runs-on: ubuntu-latest
    needs: backend_logic_tests # Hanya berjalan jika backend lolos
    steps:
    - name: ⬇️ Checkout kode
      uses: actions/checkout@v4

    # Task Tim B: Memastikan JavaScript Syntax Benar (Linting)
    - name: 🧹 JavaScript Syntax Check (Linting)
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm install -g eslint && eslint public/assets/js/ --ext .js
      continue-on-error: true # Diberi toleransi, tapi tetap tampilkan warning

    # Task Tim B & D: Memastikan File Frontend Kunci Ada
    - name: 🔎 Cek Ketersediaan File Frontend Krusial
      run: |
        test -f public/index.html || { echo "❌ ERROR: File index.html tidak ditemukan! Tugas Tim D Gagal."; exit 1; }
        test -f public/assets/js/main.js || { echo "❌ ERROR: File main.js tidak ditemukan! Tugas Tim B Gagal."; exit 1; }
        test -f public/assets/css/style.css || { echo "❌ ERROR: File style.css tidak ditemukan! Tugas Tim D Gagal."; exit 1; }
        echo "✅ Semua file frontend kunci tersedia."

    # Task Tim D: Validasi Struktur HTML/Input
    - name: 🔎 Cek Elemen Input Krusial di index.html
      run: |
        # Memastikan form input utama untuk budget ada di HTML
        if grep -q 'name="budget_usd"' public/index.html; then
          echo "✅ Elemen input 'budget_usd' ditemukan."
        else
          echo "❌ ERROR: Elemen input 'budget_usd' tidak ditemukan di index.html. Tugas Tim D Gagal."
          exit 1
        fi

  # =======================================================
  # JOB 3: DOCS_AND_SETUP (Tim C & D)
  # Fokus: Kelengkapan Dokumentasi & Struktur
  # =======================================================
  docs_and_setup_check:
    runs-on: ubuntu-latest
    steps:
    - name: ⬇️ Checkout kode
      uses: actions/checkout@v4

    # Task Tim D: Memastikan Dokumentasi Kunci Ada
    - name: 🔎 Cek File Dokumentasi
      run: |
        test -f README.md || { echo "❌ ERROR: File README.md tidak ditemukan! Tugas Tim D Gagal."; exit 1; }
        test -f docs/API_DOCS.md || { echo "❌ ERROR: File API_DOCS.md tidak ditemukan! Tugas Tim D Gagal."; exit 1; }
        echo "✅ Semua file dokumentasi kunci tersedia."

    # Task Tim C: Memastikan File Konfigurasi Dasar Ada
    - name: 🔎 Cek File Konfigurasi PHP
      run: |
        test -f api/config.php || { echo "❌ ERROR: File config.php tidak ditemukan! Tugas Tim C Gagal."; exit 1; }
        echo "✅ File konfigurasi PHP dasar tersedia."
        
    # Task Tim C: Memastikan File .gitignore Ada (Keamanan)
    - name: 🔒 Cek File .gitignore
      run: |
        # File .gitignore harus ada untuk mencegah commit file sensitif seperti kunci API lokal.
        test -f .gitignore || { echo "⚠️ WARNING: File .gitignore tidak ditemukan! Harap dibuat."; }
        echo "✅ Pengecekan .gitignore selesai."