<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Bundle Creator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="app-container">

        <header class="app-header">
            <h1>Bundle Creator</h1>
            <p>Rekomendasi bundle berdasarkan budget Anda</p>
        </header>

        <!-- Form -->
        <div class="card">
            <form id="budget-form" class="form-grid">
                <div class="form-group">
                    <label>Budget (USD)</label>
                    <input type="number" name="budget_usd" placeholder="Contoh: 500" required>
                </div>

                <div class="form-group">
                    <label>Tipe Bundle</label>
                    <select name="bundle_type" required>
                        <option value="">-- Pilih --</option>
                        <option value="ISI_KAMAR_KOS">Kebutuhan Isi Kamar Kos (Hemat)</option>
                        <option value="GAMING_DASAR">Peralatan Gaming Dasar</option>
                        <option value="CONTENT_CREATOR">Starter Pack Content Creator (HP)</option>
                        <option value="KEBERSIHAN_TOILET">Alat Kebersihan Kamar Mandi</option>
                        <option value="COFFEE_STATION">Home Coffee Corner (Manual)</option>
                        <option value="WFH_ERGONOMIC">WFH Setup Ergonomis</option>
                        <option value="HOME_GYM">Olahraga Mandiri di Rumah</option>
                        <option value="TRAVELLING_LIGHT">Travelling Singkat (Backpacker)</option>
                        <option value="DAPUR_MINIMALIS">Dapur Kos Praktis</option>
                        <option value="SNEAKER_CARE">Sneaker Care Kit</option>
                        <option value="SMART_HOME_BUDGET">Smart Home Dasar</option>
                        <option value="DIY_TOOLS">Alat Pertukangan Dasar</option>
                        <option value="AIR_PURITY">Kesehatan Udara Kamar</option>
                        <option value="SKINCARE_BASIC">Skincare Basic Starter</option>
                        <option value="SECURITY_KIT">Sistem Keamanan Kamar</option>
                    </select>
                </div>

                <div class="form-action">
                    <button type="submit">Generate Bundle</button>
                </div>
            </form>
        </div>

        <!-- Ringkasan -->
        <div id="summary" class="summary-card"></div>

        <!-- Hasil -->
        <div id="results-container"></div>

    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
